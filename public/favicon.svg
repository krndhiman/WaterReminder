<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#111114;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="dropGradient" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" style="stop-color:#0a84ff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1e6bdb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#30b0c7;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="highlight" cx="42%" cy="30%" r="28%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="65%" r="55%">
      <stop offset="0%" style="stop-color:#30b0c7;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#0a84ff;stop-opacity:0"/>
    </radialGradient>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="roundedRect">
      <rect width="512" height="512" rx="116" ry="116"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Glow beneath drop -->
  <ellipse cx="256" cy="370" rx="110" ry="38" fill="url(#glow)"/>
  <!-- Water Drop Path -->
  <path d="M256 90 C256 90, 140 230, 140 315 C140 382 192 420 256 420 C320 420 372 382 372 315 C372 230 256 90 256 90 Z"
        fill="url(#dropGradient)"
        filter="url(#dropShadow)"
        clip-path="url(#roundedRect)"/>
  <!-- Highlight reflection -->
  <path d="M256 90 C256 90, 140 230, 140 315 C140 382 192 420 256 420 C320 420 372 382 372 315 C372 230 256 90 256 90 Z"
        fill="url(#highlight)"/>
</svg>