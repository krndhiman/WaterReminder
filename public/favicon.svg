<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#0066eb" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" stroke="#222228" stroke-width="6" />

  <!-- Outer Reminder Clock Dial with Ticks -->
  <circle cx="256" cy="256" r="185" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" fill="none" />
  
  <!-- Dial Progress Arc (Active Reminder Gauge) -->
  <path d="M 256 71 A 185 185 0 1 1 100 355" stroke="url(#ringGrad)" stroke-width="16" stroke-linecap="round" fill="none" filter="url(#glow)" />
  
  <!-- Subtle Dial Tick Marks -->
  <line x1="256" y1="83" x2="256" y2="98" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" />
  <line x1="429" y1="256" x2="414" y2="256" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="429" x2="256" y2="414" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" />
  <line x1="83" y1="256" x2="98" y2="256" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" />

  <!-- Center Water Droplet with Gloss Highlight -->
  <path d="M 256 145 C 256 145, 170 250, 170 315 C 170 365, 208 395, 256 395 C 304 395, 342 365, 342 315 C 342 250, 256 145, 256 145 Z" fill="url(#dropGrad)" filter="url(#glow)" />
  <ellipse cx="230" cy="275" rx="16" ry="32" transform="rotate(-25 230 275)" fill="rgba(255, 255, 255, 0.45)" />
</svg>